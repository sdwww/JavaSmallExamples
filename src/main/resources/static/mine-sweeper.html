<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>扫雷</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; background: #e8e8e8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .header { display: flex; gap: 20px; align-items: center; background: #c0c0c0; padding: 8px 16px; border: 2px solid #888; }
        .header span { font-size: 20px; }
        .face { cursor: pointer; font-size: 24px; }
        .grid { display: grid; border: 3px solid #888; background: #c0c0c0; }
        .cell { width: 50px; height: 50px; border: 2px solid; border-color: #fff #666 #666 #fff; background: #c0c0c0; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; cursor: pointer; }
        .cell:hover { background: #d8d8d8; }
        .cell.open { border-color: #666; background: #c0c0c0; }
        .cell.flag { border-color: #666; }
        .cell.flag::after { content: '🚩'; font-size: 26px; }
        .cell.mine { border-color: #666; }
        .cell.mine::after { content: '💣'; font-size: 26px; }
        .cell[data-n='1'] { color: #00f; }
        .cell[data-n='2'] { color: #080; }
        .cell[data-n='3'] { color: #f00; }
        .cell[data-n='4'] { color: #008; }
        .cell[data-n='5'] { color: #800; }
        .cell[data-n='6'] { color: #088; }
        .cell[data-n='7'] { color: #000; }
        .cell[data-n='8'] { color: #888; }
        .msg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; font-size: 40px; color: #fff; }
        .msg.show { display: flex; }
        .msg.win { background: rgba(0,128,0,.5); }
        .msg.lose { background: rgba(128,0,0,.5); }
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; background: #f59e0b; color: #fff; border-radius: 4px; font-size: 16px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 100; max-width: 320px; }
        .toast.show { opacity: 1; }
        .difficulty { padding: 6px 10px; font-size: 16px; border: 2px solid #888; background: #c0c0c0; cursor: pointer; }
    </style>
</head>
<body>
<div class="header">
    <select id="difficulty" class="difficulty">
        <option value="EASY" selected>初级</option>
        <option value="MEDIUM">中级</option>
        <option value="HARD">高级</option>
    </select>
    <span id="mines">040</span>
    <span class="face" id="face" onclick="reset()">😊</span>
    <span id="time">000</span>
</div>
<div class="grid" id="grid"></div>
<div class="msg" id="msg"></div>
<div class="toast" id="toast"></div>
<script src="mine-sweeper.js"></script>
</body>
</html>
